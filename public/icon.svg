<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon: the horn and the rainbow arc, which is the whole game in one mark -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241d4d"/>
      <stop offset="1" stop-color="#0d0b1c"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#ff5f6d"/>
      <stop offset="0.25" stop-color="#ffd166"/>
      <stop offset="0.5"  stop-color="#7ed957"/>
      <stop offset="0.75" stop-color="#4bc0ff"/>
      <stop offset="1"    stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff9ecb"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <!-- The tether, sweeping up to a prism -->
  <path d="M108 404 Q248 300 372 148" stroke="url(#arc)" stroke-width="34"
        stroke-linecap="round" fill="none" opacity="0.35"/>
  <path d="M108 404 Q248 300 372 148" stroke="url(#arc)" stroke-width="16"
        stroke-linecap="round" fill="none"/>

  <!-- The anchor prism at the top of the arc -->
  <path d="M372 108 L400 148 L372 188 L344 148 Z" fill="#ffffff"/>

  <!-- Prism's horn at the bottom, catching the rope -->
  <path d="M96 424 L150 344 L136 428 Z" fill="url(#horn)"/>
  <circle cx="104" cy="418" r="30" fill="#ffffff" opacity="0.95"/>
</svg>
